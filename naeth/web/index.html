<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      El simbolo de Naeth, INLINE como data URI, y esto no es una preferencia de estilo.

      Un favicon en `public/` acabaria en la raiz de `dist/`, y en produccion esa raiz NO LA SIRVE
      NADIE: `app/mcp_server.py` monta exactamente dos cosas, la ruta `/` y `/assets`. Medido el
      28/08/2026 contra :8801, `/favicon.ico` da 404 y `/assets/*` da 200. O sea que el fichero
      suelto se veria en `npm run dev` y no en produccion, que es el peor sitio donde descubrirlo.

      Lleva su color escrito porque un favicon no hereda `currentColor`, y lleva dentro su propia
      media query porque se ve sobre el chrome del navegador y no sobre el visor: en tema oscuro la
      tinta clara, en claro la oscura. Los dos valores son los mismos que la ronda de color fijo.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cstyle%3Epath%7Bfill:%231f2329%7D@media(prefers-color-scheme:dark)%7Bpath%7Bfill:%23e6e8eb%7D%7D%3C/style%3E%3Cpath%20d='M2%202h3v20H2zM19%202h3v20h-3zM2%202h3l7.65%209H9.65zM11.35%2013h3L22%2022h-3z'/%3E%3C/svg%3E"
    />
    <title>Naeth · visor</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
