# Naeth v1 · Pila base (Paso 7, Fase 1): db + api + worker.
# MCP/OAuth NO estan aqui todavia (Fases 2-3). Todo escucha solo en loopback.
#
# Almacenamiento (decidido 2026-06-24):
#   - pgdata  -> volumen Docker nombrado (gestionado/ext4 sobre la disk image de Docker),
#               NO bind-mount NTFS (Postgres rinde mal sobre el FS montado de Windows).
#   - assets  -> bind-mount a la ruta de ASSETS_PATH (NTFS vale para servir blobs).

services:
  # Postgres PROPIO de Naeth. Desde el cutover a CENIT (Fase 4, jul-2026) los datos viven en el
  # Postgres del NUCLEO (modules-db) y esta base ya no es produccion: quedo como rollback en
  # frio y se retiro en 8.3 (parada, con su volumen conservado).
  #
  # profile "test" (CENIT 8.5): sin el, cada `up.ps1` la RESUCITABA -- deshaciendo la retirada
  # sin que nadie lo pidiera, y dejando dos Postgres de Naeth vivos a la vez. Su unico uso
  # legitimo hoy son los tests (TEST_DB_HOST: db), que ya corren con `--profile test`.
  db:
    profiles: ["test"]
    image: pgvector/pgvector:pg17
    shm_size: 8gb                 # build paralelo de HNSW usa /dev/shm (Paso 6 §8); 64MB por defecto -> DiskFull enganoso
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naeth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naeth}
      POSTGRES_DB: ${POSTGRES_DB:-naeth}
      EMBED_DIM: ${EMBED_DIM:-1024}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/schema/schema.sql:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # solo loopback, para inspeccion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naeth} -d ${POSTGRES_DB:-naeth}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # SIN restart policy, a proposito (02/08/2026). Tenia `unless-stopped`, y el profile NO protege
    # de eso: los profiles solo filtran en `compose up`, no gobiernan al daemon. Resultado: un
    # `--profile test` que no se baja al terminar deja la base creada, y a partir de ahi CADA
    # arranque de Docker la resucitaba sola. Se vio hoy: creada el 29/07 23:35 por unos tests,
    # viva otra vez el 02/08 10:54 con el daemon, con su ultima escritura en el 17/07 (cutover).
    # Los tests no la necesitan: `depends_on: service_healthy` ya la levanta en cada `run`.

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # Fase 4 (CENIT): DSN al Postgres del NUCLEO (modules-db); schema memory via search_path del rol.
      NAETH_DSN: postgresql://cenit:${CENIT_DB_PASSWORD:?falta CENIT_DB_PASSWORD (usa up.ps1)}@modules-db:5432/cenit
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      EMBED_DIM: ${EMBED_DIM:-1024}
      BEARER_TOKEN: ${BEARER_TOKEN:-}
      # Fase 4: auth via IdP central (Pocket-ID) con OIDCProxy; Naeth ya no es su propio AS.
      OAUTH_ENABLED: "1"
      OAUTH_PROVIDER: oidc
      # Paso 8.3: parametrizado para el multi-nodo. El nodo local sirve memory.enraxk.dev;
      # el VPS `finally` arranca en staging con memory-finally.enraxk.dev y pasará al host de
      # producción en 8.6. Debe coincidir con el host público real: el OIDCProxy construye con
      # él sus URLs de callback y de discovery, y un valor equivocado rompe el flujo OAuth.
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-https://memory.enraxk.dev}
      # El discovery va al Pocket-ID **LOCAL** (mismo host, por `cenit-net`), NO al hostname
      # publico. `id.enraxk.dev` es de clase MOVIL: su CNAME sigue al lider, asi que apuntar
      # ahi ataba el ARRANQUE de esta API a que el lider estuviese vivo. El 30/07/2026 eso
      # cerro un circulo: apagon -> el lider queda muerto -> la API local no arranca -> la
      # sonda de salud no responde -> `core owner recover` no mueve el mando -> el lider sigue
      # muerto. Cinco horas sin servicio y sin recuperacion automatica posible.
      # El documento que devuelve el IdP local es IDENTICO (verificado: mismo issuer y mismos
      # endpoints publicos, porque Pocket-ID los emite con su APP_URL publica), asi que el
      # flujo OAuth no cambia en nada: solo cambia a quien se le pide el metadato.
      OIDC_CONFIG_URL: ${OIDC_CONFIG_URL:-http://pocket-id:1411/.well-known/openid-configuration}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?falta OIDC_CLIENT_ID (usa up.ps1)}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?falta OIDC_CLIENT_SECRET (usa up.ps1)}
      # Paso 10: warn = guarda aunque el agente no declare modelo; strict = lo rechaza
      # (instructivo). El aviso de "activar solo cuando los clientes hayan recargado el
      # schema" se cumplio el 21/07/2026, asi que el default sube a strict el 30/08/2026.
      #
      # MOTIVO DEL CAMBIO DE DEFAULT, medido ese dia: `strict` vivia SOLO en el `.env` del
      # PC, y `finally` no tiene `.env` (alli las variables salen de SOPS via up.sh). El
      # respaldo llevaba desde el 21/07 en `warn`, asi que con el liderando se podia escribir
      # sin declarar modelo, y el failover decide quien manda. Una regla de escritura que solo
      # aplica en un nodo no es una regla; el compose es lo unico que los dos comparten.
      # El visor NO se ve afectado: sus rutas llaman a core con _HUMAN_AUTHOR sin pasar por
      # _enforce_model, que cuelga solo de las tools MCP.
      AUTHORSHIP_ENFORCE: ${AUTHORSHIP_ENFORCE:-strict}
      # Fase 4: warn = guarda aunque no venga digest; strict = lo rechaza. Activado el
      # 30/08/2026, al cerrar el backfill de las 479 vigentes. Mismo aviso que arriba: un
      # cliente con el schema viejo cacheado no podra escribir hasta reconectar.
      #
      # EL DEFAULT ES `strict` A PROPOSITO, por el mismo motivo que el de arriba y descubierto
      # al ponerlo: las dos reglas vivian solo en el `.env` del PC, y el respaldo no tiene.
      NAETH_DIGEST_ENFORCE: ${NAETH_DIGEST_ENFORCE:-strict}
      # Visor v2 (Vite + Svelte). Sin esta variable se sirve el v1 de `app/viewer/`, que se
      # conserva justo para eso: el rollback es quitar estas dos lineas y recrear, sin tocar
      # una sola linea de codigo.
      NAETH_VIEWER_DIR: /srv/viewer
    volumes:
      - ./app:/srv/app                            # banco Fase 1: iterar sin rebuild
      # El build del visor v2. Bind-mount PROPIO y no copiado dentro de `app/`, que se monta con
      # --reload: escribir ahi los 192 ficheros del build disparia el hot-reload y dejaria colgado
      # a `naeth-viewer-1`, que es por donde entra Claude Code. Solo lectura: nadie escribe ahi.
      - ./web/dist:/srv/viewer:ro
      - ${ASSETS_PATH:-./assets}:/assets          # bind-mount, ver ASSETS_PATH en .env
      - fastembed_cache:/root/.cache/fastembed   # comparte el modelo con el worker (no re-descargar)
      # Store del OAuthProxy de FastMCP (CENIT 8.5). Aqui viven los clientes registrados, los
      # authorization codes y los JTI MAPPINGS: la tabla que traduce el refresh token que tiene
      # claude.ai al refresh token de Pocket-ID. Sin ella, un refresh responde invalid_grant
      # ("JTI mapping not found") y el cliente tiene que volver a autorizar.
      #
      # Estaba en la capa del contenedor, asi que se perdia al RECREARLO (un `up` con cualquier
      # cambio del compose, no solo un restart). Va a volumen para que sobreviva, y porque el
      # multi-nodo necesita poder copiarlo al otro nodo.
      #
      # El subdirectorio es un fingerprint derivado del OIDC_CLIENT_SECRET, asi que es EL MISMO
      # en los dos nodos (verificado: 1346950eecea existe en ambos) -> el store es transplantable
      # tal cual. Su contenido va cifrado con Fernet, con clave derivada del mismo secreto.
      - oauth_store:/root/.local/share/fastmcp
    ports:
      - "127.0.0.1:${API_PORT:-8800}:8000"   # visor + API, solo loopback
    networks: [default, cenit-net]           # cenit-net: alcanzar modules-db del nucleo
    # Salud REAL del proceso: que la app CONTESTE, no que el PID exista. Anadido el 2026-08-16,
    # tras el incidente del 15/08 en `finally`: la app murio al importar y el proceso reloader
    # siguio vivo como PID 1, asi que `docker ps` dijo `running` con 0 reinicios durante 25 h.
    #
    # ⚠ LO QUE ESTO **NO** HACE, y conviene tenerlo claro: NO reinicia nada. Las restart policies
    # de Docker reaccionan a que el contenedor TERMINE, no a que pase a `unhealthy` (el reinicio
    # por salud es de Swarm y de Kubernetes, no de Compose). Es una creencia muy extendida y es
    # falsa. Esto sirve para que `docker ps` diga la verdad y para dar una senal barata a
    # healthcheck.sh y al vigia. Quien evita la caida es arrancar sin `--reload` en el nodo de
    # respaldo (ver docker-compose.finally.yml), no este bloque.
    #
    # urllib en vez de curl porque la imagen es python:3.12-slim y no trae curl; y de la stdlib
    # en vez de httpx para no depender de una transitiva de fastmcp.
    # `start_period` holgado a proposito: el arranque carga el modelo de embeddings y ademas
    # puede pasarse minutos reintentando el discovery del IdP (ver _retry_discovery). Durante
    # ese rato los fallos no cuentan como caida.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: python -m app.worker
    environment:
      NAETH_DSN: postgresql://cenit:${CENIT_DB_PASSWORD:?falta CENIT_DB_PASSWORD (usa up.ps1)}@modules-db:5432/cenit
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      EMBED_DIM: ${EMBED_DIM:-1024}
    volumes:
      - ./app:/srv/app                            # banco Fase 1: iterar sin rebuild
      - ${ASSETS_PATH:-./assets}:/assets
      - fastembed_cache:/root/.cache/fastembed   # no re-descargar el modelo en cada arranque
    networks: [default, cenit-net]
    # El worker NO sirve HTTP, asi que aqui se mide lo unico que se puede medir barato y de
    # verdad: que este contenedor alcanza su Postgres. Cubre el fallo real y frecuente (base
    # caida, credenciales, red del compose).
    #
    # ⚠ Dicho con todas las letras: NO detecta un worker COLGADO. Un proceso vivo que no procesa
    # ni un job da VERDE aqui. Para eso haria falta un latido del propio worker, que hoy no
    # existe. Se dice porque un healthcheck que aparenta medir mas de lo que mide es peor que no
    # tener ninguno: ensena a confiar en un verde que no significa lo que parece.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,psycopg; psycopg.connect(os.environ['NAETH_DSN'], connect_timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Visor + /api del modulo memory en su PROPIO puerto (mini-proyecto de seguridad, jul-2026).
  # OAUTH_ENABLED=0 -> este proceso NO exige el OAuth de /mcp. Nunca queda desnudo en internet:
  #   - por naeth-visor.enraxk.dev entra tras forward-auth SSO (oauth2-proxy -> Pocket-ID);
  #   - por 127.0.0.1:8801 es loopback (zona de confianza) = el /mcp local de Claude Code.
  # Misma imagen/codigo/DB que api; solo cambia el puerto y que aqui /mcp va sin auth.
  viewer:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    environment:
      NAETH_DSN: postgresql://cenit:${CENIT_DB_PASSWORD:?falta CENIT_DB_PASSWORD (usa up.ps1)}@modules-db:5432/cenit
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      EMBED_DIM: ${EMBED_DIM:-1024}
      OAUTH_ENABLED: "0"        # SSO por oauth2-proxy delante (publico) + loopback local
      AUTHORSHIP_ENFORCE: ${AUTHORSHIP_ENFORCE:-strict}   # Paso 10 (ver nota en api)
      NAETH_DIGEST_ENFORCE: ${NAETH_DIGEST_ENFORCE:-strict}   # fase 4 (ver nota en api)
      # Visor v2 (Vite + Svelte). Sin esta variable se sirve el v1 de `app/viewer/`, que se
      # conserva justo para eso: el rollback es quitar estas dos lineas y recrear, sin tocar
      # una sola linea de codigo.
      NAETH_VIEWER_DIR: /srv/viewer
    volumes:
      - ./app:/srv/app
      # El build del visor v2. Bind-mount PROPIO y no copiado dentro de `app/`, que se monta con
      # --reload: escribir ahi los 192 ficheros del build disparia el hot-reload y dejaria colgado
      # a `naeth-viewer-1`, que es por donde entra Claude Code. Solo lectura: nadie escribe ahi.
      - ./web/dist:/srv/viewer:ro
      - ${ASSETS_PATH:-./assets}:/assets
      - fastembed_cache:/root/.cache/fastembed
    ports:
      - "127.0.0.1:8801:8000"   # visor + /api + /mcp(sin auth) en loopback
    networks: [default, cenit-net]
    # Igual que el de `api` (ver la nota larga alli). `start_period` mas corto porque este
    # proceso arranca con OAUTH_ENABLED=0: no hace discovery del IdP, asi que no tiene el
    # tramo de reintentos que justifica los 120 s del otro.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Tests (Paso 6/7, core del grafo). No arranca en `up` normal: profile "test".
  # Correr:  docker compose --profile test run --rm test
  test:
    build:
      context: .
      dockerfile: app/Dockerfile
    profiles: ["test"]
    command: sh -c "pip install -q -r app/requirements-dev.txt && python -m pytest app/tests -v"
    working_dir: /srv
    environment:
      TEST_DB_HOST: db
      SCHEMA_PATH: /srv/db/schema.sql
      EMBED_DIM: ${EMBED_DIM:-1024}
    volumes:
      - ./app:/srv/app
      - ./db:/srv/db:ro
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
  cenit-net:
    external: true      # red del nucleo CENIT (modules-db, pocket-id, caddy)

volumes:
  pgdata:
  fastembed_cache:
  oauth_store:      # ver la nota en `api`: estado del OAuthProxy, antes efimero (CENIT 8.5)
