# Override del nodo VPS `finally`. Se compone sobre docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.finally.yml up -d api worker viewer
#
# NINGÚN proceso de este nodo lleva `--reload`, y esa es toda la razón de ser del fichero.
#
# 1. SIN `--reload`. En el PC el reload es cómodo para desarrollar, pero es también lo que
#    tumbó el módulo el 2026-07-28: un fichero nuevo en `app/` disparó el hot-reload y uvicorn
#    se quedó en "Waiting for connections to close" esperando a una conexión MCP abierta. En el
#    nodo de RESPALDO eso es peor: allí no hay nadie mirando, y el visor solo recibe tráfico
#    justo cuando el PC no está para arreglarlo.
#
#    ⚠ ESTO CUBRÍA SOLO AL `viewer` HASTA EL 2026-08-16, y salió caro. El `api` se quedó con
#    `--reload`, y el 15/08 la app murió al importar (530 del IdP durante el arranque en frío)
#    mientras el proceso RELOADER seguía vivo como PID 1. Docker vio `running` con 0 reinicios,
#    `restart: unless-stopped` no se disparó nunca porque el contenedor jamás terminó, y el
#    módulo estuvo 25 h caído sin que nada lo levantase. Sin `--reload` el proceso muere de
#    verdad, Docker lo reinicia, y cada reintento es una oportunidad nueva de arrancar bien.
#    El razonamiento era correcto desde julio; lo que falló fue aplicarlo a medias.
#
# 2. SIN `ports` en el viewer. En el PC el 8801 en loopback es el /mcp de Claude Code; aquí no
#    hay Claude Code, y el único que debe alcanzar el visor es Caddy, por nombre de contenedor
#    dentro de `cenit-net`. Publicar el puerto sería superficie regalada: recuerda que este
#    proceso corre con OAUTH_ENABLED=0 y sirve el CRUD entero.
#
# 3. EL VISOR SE SIRVE DESDE LA IMAGEN, no desde `web/dist`. Añadido el 22/08/2026, cuando el v2
#    pasó a producción y este nodo se quedó con el v1: `dist/` no está versionado, así que un
#    `git pull` no lo trae, y el Node de este host es el 18, que Vite 8 ya no admite. El
#    Dockerfile lo compila en una etapa aparte y lo deja en `/srv/viewer-build`.
#
#    ⚠ La ruta es DISTINTA de la del PC (`/srv/viewer`) a propósito. El bind-mount
#    `./web/dist:/srv/viewer` del compose base se aplica también aquí, porque un override puede
#    resetear la lista de volúmenes entera pero no retirar uno solo, y aquí `web/dist` no existe:
#    Docker crearía un directorio vacío y lo montaría encima del build. Con dos rutas, ese
#    directorio vacío queda ahí sin que nadie lo mire.
services:
  api:
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      NAETH_VIEWER_DIR: /srv/viewer-build

  viewer:
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      NAETH_VIEWER_DIR: /srv/viewer-build
    ports: !reset []
